<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG 動畫教室</title>
<meta name="description" content="每天一堂，用動畫與互動範例看懂一種 RAG（檢索增強生成）技術。">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/lesson.js"></script>
<style>
  .hero{display:grid;gap:24px;grid-template-columns:1.1fr 1fr;align-items:center;padding:36px 0 8px}
  @media (max-width:760px){.hero{grid-template-columns:1fr}}
  .hero svg{width:100%;height:auto}
  .hero svg text{font-family:var(--font);fill:var(--ink)}
  .dot{animation:travel 4s linear infinite;offset-rotate:0deg}
  @keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}
  @media (prefers-reduced-motion: reduce){.dot{animation:none}}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:14px}
  .stats b{color:var(--ink);font-size:20px;margin-right:4px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">🧭 <span>RAG <b>動畫教室</b></span></a>
  <nav><a href="#lessons">所有課程</a><a href="#roadmap">路線圖</a><a href="https://github.com/dofliu/ragTutor">GitHub</a><button class="theme-btn" type="button">◐ 主題</button></nav>
</div></header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1>每天一堂，<br>用動畫看懂 RAG</h1>
      <p class="lead">檢索增強生成（Retrieval-Augmented Generation）讓大型語言模型先查資料、再回答。這裡每天新增一種 RAG 技術的教學頁：分鏡動畫說明原理、瀏覽器裡就能操作的範例、可以直接改來用的程式碼。</p>
      <div class="stats"><span><b id="n-lessons">–</b>堂已上線</span><span><b id="n-todo">–</b>堂排隊中</span></div>
      <p><a class="theme-btn" style="display:inline-block;padding:8px 16px;font-size:15px;text-decoration:none;background:var(--accent);color:#fff;border-color:var(--accent)" id="start" href="lessons/001-naive-rag.html">從第一堂開始 →</a></p>
    </div>
    <svg viewBox="0 0 440 260" role="img" aria-label="問題經過檢索取得文件，再交給語言模型產生答案">
      <path id="route" d="M40 200 C 110 200, 120 70, 220 70 S 330 200, 400 200" fill="none" style="stroke:var(--line)" stroke-width="3" stroke-dasharray="6 7"/>
      <g><rect x="10" y="176" width="64" height="46" rx="10" style="fill:var(--panel);stroke:var(--query)" stroke-width="2"/><text x="42" y="204" text-anchor="middle" font-size="13">❓ 問題</text></g>
      <g><path d="M180 40 v50 a40 10 0 0 0 80 0 v-50" style="fill:var(--panel);stroke:var(--vec)" stroke-width="2"/><ellipse cx="220" cy="40" rx="40" ry="10" style="fill:var(--panel);stroke:var(--vec)" stroke-width="2"/><text x="220" y="124" text-anchor="middle" font-size="13">知識庫</text></g>
      <g><rect x="366" y="176" width="64" height="46" rx="23" style="fill:var(--panel);stroke:var(--llm)" stroke-width="2"/><text x="398" y="204" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--llm)">LLM</text></g>
      <rect class="dot" width="16" height="11" rx="2" style="fill:var(--doc);offset-path:path('M40 200 C 110 200, 120 70, 220 70 S 330 200, 400 200')"/>
      <rect class="dot" width="16" height="11" rx="2" style="fill:var(--good);offset-path:path('M40 200 C 110 200, 120 70, 220 70 S 330 200, 400 200');animation-delay:-1.3s"/>
      <rect class="dot" width="16" height="11" rx="2" style="fill:var(--warn);offset-path:path('M40 200 C 110 200, 120 70, 220 70 S 330 200, 400 200');animation-delay:-2.6s"/>
      <text x="220" y="245" text-anchor="middle" font-size="13" style="fill:var(--muted)">Retrieve → Augment → Generate</text>
    </svg>
  </section>

  <h2 id="lessons">📚 課程</h2>
  <div class="grid" id="lesson-grid"><p class="muted">載入中…</p></div>

  <h2 id="roadmap">🗺️ 接下來的主題</h2>
  <p class="muted">依序每天上線一堂，由淺入深。</p>
  <ul class="roadmap" id="roadmap-list"></ul>
</main>

<footer><div class="wrap">RAG 動畫教室 · 內容可自由用於教學推廣 · <a href="https://github.com/dofliu/ragTutor">原始碼</a></div></footer>

<script>
(async function(){
  const esc = RagTutor.escapeHtml, lv = ['', '入門', '進階', '高階'];
  try{
    const [cat, road] = await Promise.all([
      fetch('lessons/catalog.json', {cache:'no-cache'}).then(r => r.json()),
      fetch('lessons/roadmap.json', {cache:'no-cache'}).then(r => r.json())
    ]);
    const lessons = cat.lessons;
    document.getElementById('lesson-grid').innerHTML = lessons.slice().reverse().map(l => `
      <a class="card lesson-card" href="${l.file}">
        <span class="no">#${String(l.no).padStart(3,'0')} · ${esc(l.en)}</span>
        <h3>${esc(l.title)}</h3>
        <p>${esc(l.summary)}</p>
        <span><span class="tag lv${l.level}">${lv[l.level]}</span><span class="tag">${l.date}</span></span>
      </a>`).join('');
    const todo = road.topics.filter(t => t.status !== 'done');
    document.getElementById('roadmap-list').innerHTML = todo.map(t =>
      `<li><b>${esc(t.title)}</b><br>${esc(t.en)} · ${lv[t.level]}</li>`).join('');
    document.getElementById('n-lessons').textContent = lessons.length;
    document.getElementById('n-todo').textContent = todo.length;
  }catch(e){
    document.getElementById('lesson-grid').innerHTML = '<p class="muted">請透過網站（GitHub Pages 或本機 http server）開啟以載入課程清單。</p>';
  }
})();
</script>
</body>
</html>
